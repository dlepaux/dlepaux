name: Stats cache canary

# Cache WARMING moved to srv-apps (homelab) on 2026-06-18: a systemd timer there
# (homelab roles/stats-cache-warmer) warms this exact URL hourly from a normal
# homelab egress. GitHub-hosted runners egress from Azure ranges that Hostinger's
# edge intermittently DROPS at the packet level, so the old warm job flapped red
# on transient connection timeouts that had nothing to do with the service. This
# job is now only an external-vantage reachability canary: it NEVER fails on an
# unreachable host (that's Hostinger's flaky edge, not our problem) — only on a
# genuine backend error (HTTP 5xx).

on:
  schedule:
    # Every 3h — external reachability heartbeat; warming itself is on srv-apps.
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5

      - name: Extract stats URL from readme
        id: url
        run: |
          url=$(grep -oE 'https://stats\.lepaux\.com/api/[^)]+' readme.md | head -1)
          if [ -z "$url" ]; then
            echo "::error::No stats URL found in readme.md"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Probing: $url"

      - name: Probe reachability (non-failing canary)
        run: |
          # Records an external-vantage reachability result. Fails ONLY on a real
          # backend error (5xx). A connection timeout (status 000) is Hostinger's
          # edge dropping this Azure runner IP — warming is handled by srv-apps,
          # so treat it as a soft warning, not a failure.
          status=$(curl -sS \
            --max-time 30 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null \
            -w "%{http_code}" \
            "${{ steps.url.outputs.url }}" || true)
          echo "status=$status"
          case "$status" in
            200)    echo "Reachable from this runner; cache hit served." ;;
            000|"") echo "::warning::stats.lepaux.com unreachable from this Azure runner (Hostinger edge / path flap). Warming runs on srv-apps; not failing." ;;
            5*)     echo "::error::stats backend returned HTTP $status"; exit 1 ;;
            *)      echo "::warning::unexpected HTTP $status from stats.lepaux.com (not failing)" ;;
          esac
